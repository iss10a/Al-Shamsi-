workflows:
  android-release:
    name: Al-Shamsi Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.alshamsi.assistant"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Generate Gradle wrapper if missing
        script: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, generating it..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Optional release signing
        script: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/release.jks"
            cat > "$CM_BUILD_DIR/keystore.properties" <<PROPS
          storeFile=$CM_BUILD_DIR/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "Release keystore configured."
          else
            echo "No keystore secrets found. The APK will be signed with the debug key (installable)."
          fi

      - name: Unit tests
        script: ./gradlew testDebugUnitTest --stacktrace
        ignore_failure: true

      - name: Build release APK
        script: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback)
        script: ./gradlew assembleDebug --stacktrace
        ignore_failure: true

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/mapping.txt
      - app/build/reports/**

    publishing:
      email:
        recipients:
          - CHANGE_ME@example.com
        notify:
          success: true
          failure: true
