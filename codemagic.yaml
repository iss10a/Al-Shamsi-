workflows:
  android-release:
    name: Al-Shamsi Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.alshamsi.assistant"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Find or extract the Gradle project
        script: |
          set -e
          echo "--- Repository contents ---"
          ls -la "$CM_BUILD_DIR"
          echo "---------------------------"

          find_settings() {
            find "$1" -maxdepth 5 \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/build/*' 2>/dev/null | head -n 1
          }

          SETTINGS_FILE=$(find_settings "$CM_BUILD_DIR")

          # The project may have been committed as a .zip archive: extract it automatically.
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 3 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "No Gradle project found, but an archive was: $ZIP_FILE"
              mkdir -p "$CM_BUILD_DIR/_extracted"
              unzip -q -o "$ZIP_FILE" -d "$CM_BUILD_DIR/_extracted"
              echo "Archive extracted."
              SETTINGS_FILE=$(find_settings "$CM_BUILD_DIR/_extracted")
            fi
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: no settings.gradle(.kts) found, and no archive containing one."
            echo "Push either the full Android project or the project .zip to this repository."
            exit 1
          fi

          PROJECT_DIR=$(cd "$(dirname "$SETTINGS_FILE")" && pwd)
          echo "Gradle project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          cat "$PROJECT_DIR/local.properties"

      - name: Prepare Gradle wrapper
        script: |
          set -e
          cd "$PROJECT_DIR"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, generating the wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Optional release signing
        script: |
          cd "$PROJECT_DIR"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/release.jks"
            cat > "$PROJECT_DIR/keystore.properties" <<PROPS
          storeFile=$PROJECT_DIR/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "Release keystore configured."
          else
            echo "No keystore secrets found. The APK will be signed with the debug key (installable)."
          fi

      - name: Build release APK
        script: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build debug APK (fallback)
        script: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon
        ignore_failure: true

      - name: List produced APKs
        script: |
          find "$CM_BUILD_DIR" -name '*.apk' -print
        ignore_failure: true

    artifacts:
      - "**/outputs/apk/**/*.apk"
      - "**/outputs/**/mapping.txt"
      - "**/reports/**"

    publishing:
      email:
        recipients:
          - CHANGE_ME@example.com
        notify:
          success: true
          failure: true
